version: '3.8'
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: fasthtml_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: fasthtml_db
      DB_USER: admin
      DB_PASS: 123456
      restart: always
    ports:
      - "5000:5000"
    volumes:
      - .:/app

volumes:
  postgres_data:
